[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ioc_inquest"
version = "0.1.0"
description = "Pulls data about a file, hash, IP, domain, or URL from eleven intelligence sources: VirusTotal, AbuseIPDB, Censys, OTX, abuse.ch MalwareBazaar/ThreatFox, Shodan InternetDB, GreyNoise, crt.sh, RDAP, and the CISA KEV catalog."
authors = [{name = "Koyo Keiter"}]
requires-python = ">=3.10"
dependencies = [
    "httpx==0.28.1",
    "python-dotenv==1.2.1",
    "pyzipper==0.3.6",
    "reportlab==4.4.10",
]

[project.scripts]
ioc-inquest = "ioc_inquest.cli:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ioc_inquest = ["data/*.json"]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.25.2",
    "respx==0.22.0",
    "tomli==2.2.1; python_version < '3.11'",
]
static = [
    "pefile>=2023.2.7",
    "yara-python>=4.5.0",
    "python-magic>=0.4.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

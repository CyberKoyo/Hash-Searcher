name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the old run; leaving it to finish
# only spends minutes on a diff nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Without this, a 3.10-only failure cancels the 3.12 leg and you learn
      # one thing instead of two.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        # Global Constraint 3 (every optional dependency -- pefile,
        # yara-python, python-magic -- stays genuinely optional) is only
        # real if CI actually installs the project without [static] and
        # checks that the tests gated on those libraries degrade to
        # skipped rather than failed, instead of just trusting that
        # nobody ever installs the extra by accident.
        #
        # A "static" (with-extras) value belongs on this axis too, and
        # was evaluated for this change: installing [dev,static] into a
        # throwaway venv and running the suite there does make the five
        # previously-skipped tests pass. But it also flips two unrelated
        # tests in tests/test_static_runner.py from passing to failing --
        # they mock the capability gate via `builtins.__import__`, which
        # `capabilities.have()` never calls (it goes through
        # `importlib.import_module`, which does not consult
        # `builtins.__import__`); those two tests only pass today by the
        # accident of pefile being absent from every environment they
        # have ever run in. Adding "static" here now would make this leg
        # red from its first push over a pre-existing test defect, not a
        # regression this change introduced. Fix the two capability-gate
        # tests first, then add "static" to this list.
        extras: ["none"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests/ -v
      - name: Prove the no-extras leg actually exercised the optional path
        if: matrix.extras == 'none'
        run: |
          # The default shell for a `run:` block without an explicit
          # `shell:` is `bash -e {0}` -- NOT `bash --noprofile --norc -eo
          # pipefail {0}`, which is what you get only when `shell: bash`
          # is spelled out. Without pipefail, a failing pytest piped into
          # tee would still exit 0 here, because only tee's exit status
          # is checked -- this step would happily "prove" a red suite
          # skipped some tests and call that success.
          set -o pipefail
          python -m pytest tests/ -q -rs | tee /tmp/out.txt
          grep -q "skipped" /tmp/out.txt \
            || (echo "no tests skipped; this leg proved nothing" && exit 1)

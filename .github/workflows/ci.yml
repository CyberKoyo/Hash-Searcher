name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the old run; leaving it to finish
# only spends minutes on a diff nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Without this, a 3.10-only failure cancels the 3.12 leg and you learn
      # one thing instead of two.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
        # Global Constraint 3 (every optional dependency -- pefile,
        # yara-python, python-magic -- stays genuinely optional) needs both
        # halves enforced, not just claimed:
        #   "none"   installs without [static] and proves the tests gated
        #            on those libraries degrade to skipped, not failed --
        #            the guard below fails the leg if nothing skipped.
        #   "static" installs [dev,static] (plus the system libmagic1
        #            python-magic needs) and proves the suite is fully
        #            green with the real libraries present -- the guard
        #            below fails the leg if anything still skipped, which
        #            would mean an extra silently failed to install.
        # A prior version of this file left "static" out because two
        # tests in tests/test_static_runner.py mocked the capability gate
        # via `builtins.__import__`, which `capabilities.have()` never
        # calls (it goes through `importlib.import_module`, which does
        # not consult `builtins.__import__`) -- they passed today only by
        # the accident of pefile being absent everywhere they'd run. That
        # is now fixed: they patch `importlib.import_module` directly, so
        # this leg is expected to be green.
        extras: ["none", "static"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install libmagic (with-extras leg only)
        # python-magic wraps the system libmagic; the Python package
        # installs regardless, but importing it fails without this. A
        # GitHub runner does not have it preinstalled -- unlike the
        # machine this workflow was authored on, which happened to
        # already carry it as another package's dependency.
        if: matrix.extras == 'static'
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Install
        run: pip install -e ".[dev${{ matrix.extras == 'static' && ',static' || '' }}]"
      - name: Test
        run: python -m pytest tests/ -v
      - name: Prove the no-extras leg actually exercised the optional path
        if: matrix.extras == 'none'
        run: |
          # The default shell for a `run:` block without an explicit
          # `shell:` is `bash -e {0}` -- NOT `bash --noprofile --norc -eo
          # pipefail {0}`, which is what you get only when `shell: bash`
          # is spelled out. Without pipefail, a failing pytest piped into
          # tee would still exit 0 here, because only tee's exit status
          # is checked -- this step would happily "prove" a red suite
          # skipped some tests and call that success.
          set -o pipefail
          python -m pytest tests/ -q -rs | tee /tmp/out.txt
          grep -q "skipped" /tmp/out.txt \
            || (echo "no tests skipped; this leg proved nothing" && exit 1)
      - name: Prove the with-extras leg actually installed its libraries
        if: matrix.extras == 'static'
        run: |
          # Mirror image of the guard above: there, a skip is the proof;
          # here, a skip is the failure -- it means pefile, yara-python,
          # or python-magic did not actually import, and this leg quietly
          # degraded into re-running the no-extras leg instead of testing
          # anything new. Matched on the exact skip reason
          # tests/conftest.py::requires() uses ("optional dependency
          # 'x' is not installed") rather than on "skipped" generically,
          # so an unrelated skip added by some future test -- a slow-test
          # marker, a platform guard -- can never trip this guard by
          # accident.
          set -o pipefail
          python -m pytest tests/ -q -rs | tee /tmp/out.txt
          grep -q "optional dependency" /tmp/out.txt \
            && (echo "a static-extras test was skipped; an optional library failed to import" && exit 1)
          exit 0

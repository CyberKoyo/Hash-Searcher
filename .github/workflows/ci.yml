name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch supersedes the old run; leaving it to finish
# only spends minutes on a diff nobody will read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Without this, a 3.10-only failure cancels the 3.12 leg and you learn
      # one thing instead of two.
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: python -m pytest tests/ -v
